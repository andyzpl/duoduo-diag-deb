name: Build DuoduoDiag deb

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ldid dpkg

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          rm -rf $HOME/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/theos/sdks
          ls $HOME/theos/sdks | head -20

      - name: Build package
        run: |
          cd $GITHUB_WORKSPACE
          make clean || true
          make package DEBUG=0 FINALPACKAGE=1

      - name: Collect artifact
        run: |
          mkdir -p out
          cp packages/*.deb out/ 2>/dev/null || true
          ls -la out
          test -n "$(find out -name '*.deb' -print -quit)" || { echo "no deb produced"; exit 1; }

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: DuoduoDiag-deb
          path: out/*.deb
          if-no-files-found: error
          retention-days: 30
